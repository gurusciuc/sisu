name: Windows alpha checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cargo test --locked --release --no-default-features --test policy --test import --test cookies
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          ./tools/build-windows.ps1 -BuildRoot D:/db-build
          ./tools/fetch-ubol.ps1 -Directory D:/ubol-probe
          node tools/smoke.mjs exe=dist/preview/desktop_browser.exe out=dist/results ubol=D:/ubol-probe/unpacked
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node tools/capabilities.mjs dist/preview/desktop_browser.exe dist/results/capabilities.json
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          ./tools/settings-check.ps1 -Exe "$PWD/dist/preview/desktop_browser.exe" -Out "$PWD/dist/results"
          ./tools/frame-check.ps1 -Exe "$PWD/dist/preview/desktop_browser.exe" -Out "$PWD/dist/results"
          node tools/address-check.mjs dist/preview/desktop_browser.exe dist/results
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node tools/transition.mjs dist/preview/desktop_browser.exe dist/results/new-tab-transition.json
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-workflow-evidence
          path: dist/results
