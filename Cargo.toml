[package]
name = "desktop-browser"
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "desktop_browser"
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
packaging = ["desktop", "cef/build-util", "dep:plist"]
desktop = ["dep:cef", "dep:directories", "dep:dunce", "dep:tempfile"]

[dependencies]
html5gum = "=0.9.1"
serde = { version = "1", features = ["derive"] }
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
cef = { version = "=156.6.0", optional = true, default-features = false, features = ["sandbox"] }
directories = { version = "6", optional = true }
dunce = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
serde_json = "1"
url = "2"

[build-dependencies]
cc = "1"
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
sha2 = "0.10"

[profile.release]
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication","NSEvent","NSMenu","NSMenuItem","NSResponder","NSUserInterfaceValidation","NSView","NSWindow"] }
plist = { version = "1", optional = true }

[package.metadata.cef.bundle]
helper_name = "browser-helper"
resources_path = "resources"

[[bin]]
name = "browser-helper"
path = "src/bin/browser-helper.rs"
required-features = ["desktop"]

[[bin]]
name = "stage-posix"
path = "src/bin/stage-posix.rs"
required-features = ["packaging"]

[[bin]]
name = "browser-shell"
path = "src/main.rs"
required-features = ["desktop"]
